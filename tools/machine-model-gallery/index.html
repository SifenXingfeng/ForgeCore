<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForgeCore 机器模型候选</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { padding: 38px; color: #2b2e2a; font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; background: #dfe2de; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; max-width: 1400px; margin: 0 auto 24px; }
      h1 { margin: 5px 0 0; font-size: 34px; letter-spacing: -.04em; }
      header p { max-width: 610px; margin: 0; color: #6e736d; font-size: 13px; line-height: 1.65; text-align: right; }
      .eyebrow { color: #987100; font-size: 9px; font-weight: 800; letter-spacing: .16em; }
      #gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 1320px; margin: 0 auto; }
      article { overflow: hidden; background: #f7f8f5; border: 1px solid #fff; border-radius: 18px; box-shadow: 0 15px 35px rgb(35 39 35 / 12%), inset 0 0 0 1px rgb(70 75 70 / 6%); }
      .viewport { position: relative; height: 276px; background: radial-gradient(circle at 50% 42%, #f8f9f6 0, #e7eae5 58%, #d6dad5 100%); }
      canvas { width: 100%; height: 100%; }
      .badge { position: absolute; top: 13px; left: 13px; z-index: 2; padding: 6px 8px; color: #474b46; font-size: 8px; font-weight: 800; background: rgb(250 251 248 / 84%); border: 1px solid rgb(255 255 255 / 88%); border-radius: 8px; backdrop-filter: blur(10px); }
      .badge.recommended { color: #443500; background: #f4d35f; border-color: #d7b23c; }
      .copy { min-height: 100px; padding: 14px 16px 16px; border-top: 1px solid #dde1dc; }
      .copy strong { display: block; color: #2c302c; font-size: 14px; }
      .copy small { display: block; margin-top: 3px; color: #8a8f89; font-size: 8px; font-weight: 750; letter-spacing: .08em; }
      .copy p { margin: 9px 0 0; color: #656b65; font-size: 10px; line-height: 1.55; }
      .error { display: grid; height: 100%; place-items: center; color: #a33f44; font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <div><span class="eyebrow">FORGECORE / MACHINE MODEL OPTIONS</span><h1>机器视觉模型候选</h1></div>
      <p>统一视角、统一光照、统一占地比例。标为“组合方案”的候选只复用已经入库的 Kenney CC0 模块，不创建新的第三方网格。</p>
    </header>
    <main id="gallery"></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
