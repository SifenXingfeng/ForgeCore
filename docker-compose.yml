services:
  postgres:
    image: postgres:16-alpine
    container_name: forgecore-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgecore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgecore_dev}
      POSTGRES_DB: ${POSTGRES_DB:-forgecore}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgecore} -d ${POSTGRES_DB:-forgecore}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgecore-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
